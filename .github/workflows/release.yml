name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            asset_suffix: linux-x64
          - name: macOS
            os: macos-latest
            asset_suffix: macos
          - name: Windows
            os: windows-latest
            asset_suffix: windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build application
        run: wails build

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            ditto -c -k --sequesterRsrc --keepParent build/bin/FlowRoutine.app "release/FlowRoutine-${GITHUB_REF_NAME}-${{ matrix.asset_suffix }}.zip"
          else
            tar -czf "release/FlowRoutine-${GITHUB_REF_NAME}-${{ matrix.asset_suffix }}.tar.gz" -C build/bin FlowRoutine
          fi

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force
          Compress-Archive -Path build/bin/FlowRoutine.exe -DestinationPath "release/FlowRoutine-${env:GITHUB_REF_NAME}-${{ matrix.asset_suffix }}.zip" -Force

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowRoutine-${{ matrix.asset_suffix }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
