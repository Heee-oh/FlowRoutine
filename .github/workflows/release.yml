name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    environment:
      name: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            asset_suffix: linux-x64
            environment: release-build
          - name: macOS
            os: macos-latest
            asset_suffix: macos
            environment: release-macos-signing
          - name: Windows
            os: windows-latest
            asset_suffix: windows-x64
            environment: release-windows-signing

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build application
        run: wails build

      - name: Sign and notarize macOS application
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE_P12_BASE64:?missing macOS signing certificate}"
          : "${MACOS_CERTIFICATE_PASSWORD:?missing macOS certificate password}"
          : "${MACOS_NOTARY_ISSUER_ID:?missing App Store Connect issuer ID}"
          : "${MACOS_NOTARY_KEY_ID:?missing App Store Connect key ID}"
          : "${MACOS_NOTARY_KEY_P8_BASE64:?missing App Store Connect API key}"
          : "${MACOS_SIGNING_IDENTITY:?missing Developer ID signing identity}"

          certificate_path="${RUNNER_TEMP}/flowroutine-signing.p12"
          notary_key_path="${RUNNER_TEMP}/AuthKey_${MACOS_NOTARY_KEY_ID}.p8"
          keychain_path="${RUNNER_TEMP}/flowroutine-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::${keychain_password}"

          printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" | base64 -D > "${certificate_path}"
          printf '%s' "${MACOS_NOTARY_KEY_P8_BASE64}" | base64 -D > "${notary_key_path}"
          chmod 600 "${certificate_path}" "${notary_key_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -P "${MACOS_CERTIFICATE_PASSWORD}" -t cert -f pkcs12 \
            -k "${keychain_path}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"

          codesign --force --deep --options runtime --timestamp --sign "${MACOS_SIGNING_IDENTITY}" build/bin/FlowRoutine.app
          codesign --verify --deep --strict --verbose=2 build/bin/FlowRoutine.app

          notarization_archive="${RUNNER_TEMP}/FlowRoutine-notarization.zip"
          ditto -c -k --sequesterRsrc --keepParent build/bin/FlowRoutine.app "${notarization_archive}"
          xcrun notarytool submit "${notarization_archive}" \
            --key "${notary_key_path}" \
            --key-id "${MACOS_NOTARY_KEY_ID}" \
            --issuer "${MACOS_NOTARY_ISSUER_ID}" \
            --wait
          xcrun stapler staple build/bin/FlowRoutine.app
          xcrun stapler validate build/bin/FlowRoutine.app
          spctl --assess --type execute --verbose=4 build/bin/FlowRoutine.app

      - name: Clean macOS signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "${RUNNER_TEMP}/flowroutine-signing.keychain-db" 2>/dev/null || true
          rm -f "${RUNNER_TEMP}/flowroutine-signing.p12" "${RUNNER_TEMP}"/AuthKey_*.p8 "${RUNNER_TEMP}/FlowRoutine-notarization.zip"

      - name: Sign Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_PFX_BASE64) { throw "missing Windows signing certificate" }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw "missing Windows certificate password" }

          $certificatePath = Join-Path $env:RUNNER_TEMP "flowroutine-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $importedCertificates = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          $certificate = @($importedCertificates) | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
          if (-not $certificate) { throw "Windows signing certificate has no private key" }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe was not found" }

          & $signTool.FullName sign /sha1 $certificate.Thumbprint /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 build/bin/FlowRoutine.exe
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed" }
          & $signTool.FullName verify /pa /v build/bin/FlowRoutine.exe
          if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed" }

      - name: Clean Windows signing material
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERTIFICATE_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$env:WINDOWS_CERTIFICATE_THUMBPRINT" -ErrorAction SilentlyContinue
          }
          Remove-Item (Join-Path $env:RUNNER_TEMP "flowroutine-signing.pfx") -ErrorAction SilentlyContinue

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            ditto -c -k --sequesterRsrc --keepParent build/bin/FlowRoutine.app "release/FlowRoutine-${GITHUB_REF_NAME}-${{ matrix.asset_suffix }}.zip"
          else
            tar -czf "release/FlowRoutine-${GITHUB_REF_NAME}-${{ matrix.asset_suffix }}.tar.gz" -C build/bin FlowRoutine
          fi

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force
          Compress-Archive -Path build/bin/FlowRoutine.exe -DestinationPath "release/FlowRoutine-${env:GITHUB_REF_NAME}-${{ matrix.asset_suffix }}.zip" -Force

      - name: Upload packaged artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FlowRoutine-${{ matrix.asset_suffix }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download packaged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release-assets
          format: spdx-json
          output-file: release-assets/FlowRoutine-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Generate checksums and update metadata
        run: |
          go run ./cmd/release-manifest \
            -assets release-assets \
            -output release-assets/update-manifest.json \
            -repository "${GITHUB_REPOSITORY}" \
            -source-commit "${GITHUB_SHA}" \
            -tag "${GITHUB_REF_NAME}" \
            -sequence "${GITHUB_RUN_NUMBER}"

      - name: Upload prepared release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FlowRoutine-release-assets
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Attest and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: prepare
    environment:
      name: release-publishing

    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Download prepared release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: FlowRoutine-release-assets
          path: release-assets

      - name: Verify prepared release inventory
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "FlowRoutine-${GITHUB_REF_NAME}-linux-x64.tar.gz"
            "FlowRoutine-${GITHUB_REF_NAME}-macos.zip"
            "FlowRoutine-${GITHUB_REF_NAME}-windows-x64.zip"
            "FlowRoutine-${GITHUB_REF_NAME}.spdx.json"
            "SHA256SUMS"
            "update-manifest.json"
          )
          for name in "${expected[@]}"; do
            [[ -f "release-assets/${name}" ]] || { echo "missing release asset: ${name}" >&2; exit 1; }
          done
          actual_count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          [[ "${actual_count}" == "${#expected[@]}" ]] || { echo "unexpected release asset count: ${actual_count}" >&2; exit 1; }

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign release files with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "${file}"
          done < <(find release-assets -maxdepth 1 -type f ! -name '*.sigstore.json' -print0 | sort -z)

      - name: Verify release signatures
        shell: bash
        run: |
          set -euo pipefail
          expected_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}"
          while IFS= read -r -d '' file; do
            cosign verify-blob \
              --bundle "${file}.sigstore.json" \
              --certificate-identity "${expected_identity}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${file}"
          done < <(find release-assets -maxdepth 1 -type f ! -name '*.sigstore.json' -print0 | sort -z)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: release-assets/SHA256SUMS

      - name: Classify release
        id: release-kind
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
            echo "make_latest=false" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
            echo "make_latest=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: ${{ steps.release-kind.outputs.make_latest }}
          prerelease: ${{ steps.release-kind.outputs.prerelease }}
