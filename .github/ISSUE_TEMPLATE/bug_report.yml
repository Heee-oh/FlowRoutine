name: Bug report
description: Report a reproducible problem in FlowRoutine.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: List the exact steps to reproduce the issue.
      placeholder: |
        1. Start the app with ...
        2. Create a scenario with ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / architecture
      placeholder: "macOS 15 arm64, Ubuntu 24.04 amd64, Windows 11 amd64"
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Tool versions
      description: Include Go, Node.js, npm, and Wails versions when relevant.
      placeholder: |
        go version
        node --version
        npm --version
        wails version
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
